# EduVerse — chạy toàn bộ hệ thống bằng một lệnh: docker compose up -d --build
# Hướng dẫn đầy đủ: docs/architecture/deployment.md
#
# Cần có file .env cùng thư mục (sao chép từ .env.example).
# Chưa có Redis vì backend chưa dùng (rate limiter đang lưu in-memory); thêm service redis khi làm BullMQ (Phase 2).

name: eduverse

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD - sao chép .env.example thành .env}
      POSTGRES_DB: ${POSTGRES_DB:-eduverse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      # Frontend và API cùng một địa chỉ (nginx chuyển tiếp /api và /uploads tới backend)
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-8080}
      BACKEND_URL: http://localhost:${FRONTEND_PORT:-8080}
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduverse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eduverse}
      DATABASE_SSL: "false"
      DB_AUTO_INIT: ${DB_AUTO_INIT:-true}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET - sao chép .env.example thành .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Thiếu REFRESH_TOKEN_SECRET - sao chép .env.example thành .env}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      # Tùy chọn: để trống thì upload dùng thư mục uploads (volume) và API AI trả 503
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Lần chạy đầu phải tạo bảng và nạp dữ liệu mẫu nên cần thời gian
      start_period: 180s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
  uploads-data:
