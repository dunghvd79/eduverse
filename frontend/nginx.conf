server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Tài liệu bài học tối đa 50MB, bài nộp tối đa 100MB (uploadService.js, assignmentValidation.js)
  client_max_body_size 120m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker DNS: phân giải lại tên "backend" khi container backend được tạo lại
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API và tệp tải lên (Local Storage) do backend phục vụ. Frontend gọi cùng origin nên không cần CORS riêng.
  location ~ ^/(api|uploads)/ {
    set $backend_upstream http://backend:5000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # File build của Vite có hash trong tên -> cache lâu dài
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html không cache để luôn nhận bản build mới
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single Page Application: đường dẫn React Router (/student/..., /teacher/...) trả về index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
